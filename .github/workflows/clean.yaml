name: Branch Deleted

on: delete

jobs:
  Clean:          
    name: Clean
    runs-on: ubuntu-latest
    steps:
      - name: Clean up - Branch
        if: github.event.ref_type == 'branch'
        run: |
          echo "Clean up for BRANCH ${{ github.event.ref }}"

      - name: Clean up TAG
        if: github.event.ref_type == 'tag'
        run: |
          echo "Clean up for TAG ${{ github.event.ref }}"

      - name: Test for ci
        shell: pwsh
        run: |
          echo "TEST"
          echo "${{ github.event.name }}" 
          echo "${{ github.event_name }}" 
          if ("${{ github.event.name }}" -eq "pull_request" ) {  
            echo "PR"
          } else if ("${{ github.event.name }}" -eq "delete" ) {  
            echo "DEL"
          } 
          echo "TEST done"
