name: Branch Deleted

on: delete

jobs:
  Clean:          
    name: Clean
    runs-on: ubuntu-latest
    steps:
      - name: Clean up - Branch
        if: github.event.ref_type == 'branch'
        run: |
          echo "Clean up for BRANCH ${{ github.event.ref }}"

      - name: Clean up TAG
        if: github.event.ref_type == 'tag'
        run: |
          echo "Clean up for TAG ${{ github.event.ref }}"

      - name: Test for ci
        shell: pwsh
        run: |
          echo "TEST"
          echo  "${{ github.event.ref }}"
          if ("${{ github.event_name }}" -eq "pull_request" ) {  
            echo "PR"
            $branchName =$Env:GITHUB_BASE_REF
            $branchName1 = ${{ github.base_ref }}
            echo $branchName
            echo $branchName1

          } elseif ("${{ github.event_name }}" -eq "delete" ) {  
             echo "DEL"
             $branchName = "${{ github.event.ref }}" -replace "refs/heads/", ""
             echo $branchName
          } 
          echo "TEST done"
